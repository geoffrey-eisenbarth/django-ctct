[project]
name = "django-ctct"
version = "0.0.1.dev7"
description = "A Django interface for the Constant Contact API"
authors = [
    {name = "Geoffrey Eisenbarth",email = "geoffrey.eisenbarth@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0)",
    "requests (>=2.32.3,<3.0.0)",
    "ratelimit (>=2.2.1,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
]


[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
  "ipdb>=0.13.13",
  "pytest>=8.3.4",
  "pytest-django>=4.10.0",
  "parameterized>=0.9.0",
  "coverage>=7.6.12",
  "factory-boy>=3.3.3",
  "requests-mock>=1.12.1",
  "codecov>=2.1.13",
  "mypy>=1.15.0",
  "django-stubs[compatible-mypy]>=6.1.0,<7.0.0",
  "types-requests>=2.32.0.20250306",
  "django-stubs-ext>=6.1.0",
  "pre-commit>=4.2.0",
  "types-ratelimit>=2.2.0.20250501",
  "types-factory-boy>=0.4.1",
  "ruff>=0.16.7",
]

[tool.ruff]
line-length = 88
indent-width = 2
target-version = "py312"
exclude = [
  "*/migrations/*",
  "manage.py",
  "settings.py",
  "local_settings.py",
  "vendor.py",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (unused imports, undefined names, etc.)
  "I",   # isort (automatically sorts and organizes imports)
  "UP",  # pyupgrade (modernizes Python syntax)
  # "RUF100",  # flags unused noqa comments
]
ignore = [
  "E111",  # Indentation is not a multiple of four
  "E114",  # Comment indentation is not a multiple of four
  "E731",  # Do not assign a lambda expression, use a def
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"

[tool.coverage.run]
branch = true
source = ["django_ctct"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true
packages = ["django_ctct", "tests"]
exclude = [
  "factories.py",
  'django_ctct/migrations',
  "tests/project/manage.py",
  "tests/project/project",
]

[tool.django-stubs]
django_settings_module = "tests.project.project.settings"
